<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let humanScore = 0;
        let computerScore = 0;
        playGame();
        //console.log(`Computer choice: ${getComputerChoice()}`);
        //console.log(`Human choice: ${getHumanChoice()}`);
        //playRound(humanChoice, computerChoice);

        function getComputerChoice(){
            /*
            Choice Variable:
            Get a random number from Math.random
            Multiply by 10
            Modulo by 3 to get a 0, 1 or 2

            Switch statement using choice variable;
            0 = rock
            1 = paper
            2 = scissors

            return one of the above as string
            */
           let choice = Math.round((Math.random() * 10)) % 3;
           //console.log(`Random value generated: ${choice}`);

           switch(choice) {
            case 0: 
                return "rock";
            case 1: 
                return "paper";
            case 2:
                return "scissors";
           }

           return "";
        }

        function getHumanChoice(){
            /*
            prompt for a user's input
            return that input
            */
           return prompt("Rock, paper, or scissors?");
        }

        function playRound(){
            let humanSelection = getHumanChoice().toLowerCase();
            let computerSelection = getComputerChoice();
            if (humanSelection === computerSelection){
                console.log(`Tie! You both picked ${humanSelection}!`);
                return;
            } else {
                switch(humanSelection){
                    case "rock":
                        if(computerSelection === "scissors"){
                            console.log(`You win! You chose ${humanSelection} and the computer chose ${computerSelection}!`)
                            humanScore += 1;
                        } else {
                            console.log(`You lose! You chose ${humanSelection} and the computer chose ${computerSelection}!`)
                            computerScore += 1;
                        }
                        break;
                    case "paper": 
                        if(computerSelection === "rock"){
                            console.log(`You win! You chose ${humanSelection} and the computer chose ${computerSelection}!`)
                            humanScore += 1;
                        } else {
                            console.log(`You lose! You chose ${humanSelection} and the computer chose ${computerSelection}!`)
                            computerScore += 1;
                        }
                        break;
                    case "scissors":
                        if(computerSelection === "paper"){
                            console.log(`You win! You chose ${humanSelection} and the computer chose ${computerSelection}!`)
                            humanScore += 1;
                        } else {
                            console.log(`You lose! You chose ${humanSelection} and the computer chose ${computerSelection}!`)
                            computerScore += 1;
                        }
                        break;
                    default: 
                        console.log(`I don't know what to do with ${humanSelection}!`);
                        break;
                }
            }
            return;
        }

        function getWinner() {
            if (computerScore > humanScore){
                console.log(`The Computer wins! Computer Score: ${computerScore} Human Score: ${humanScore}`)
            } else if (computerScore === humanScore){
                console.log(`It's a tie! Computer Score: ${computerScore} Human Score: ${humanScore}`)
            } else {
                console.log(`You win! Computer Score: ${computerScore} Human Score: ${humanScore}`)
            }
        }

        function playGame(){
            for(let i = 0; i < 5; i++){
                playRound();
            }
            getWinner();
        }

        //p r s
    </script>
</body>
</html>
